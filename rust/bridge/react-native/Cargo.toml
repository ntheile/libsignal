[package]
name = "libsignal-react-native"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.85"

[lib]
name = "libsignal_react_native"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]

[lints]
workspace = true

[dependencies]
libsignal-protocol = { workspace = true }
libsignal-core = { workspace = true }
signal-crypto = { workspace = true }

uniffi = { version = "0.29.0", features = ["tokio"] }
thiserror = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }

[features]
uniffi = []
default = ["uniffi"]
